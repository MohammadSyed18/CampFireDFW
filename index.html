<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campfire Surf · DFW</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p>DFW HACK CLUB · SURFING GAME</p><h1>Campfire Surf</h1><span>Best <strong id="best">0</strong></span></header>
<canvas aria-label="Surfing game: use left and right to steer and Space to jump" role="img"></canvas>
<div class="bar"><button id="start">Start / Retry</button><button id="pause">Pause / Resume</button><p id="status" role="status">Collect shells, avoid rocks, and land your flips.</p></div>
<div class="touch" aria-label="Touch controls"><button data-control="ArrowLeft" aria-label="Steer left">←</button><button data-control="Space">Jump</button><button data-control="ArrowRight" aria-label="Steer right">→</button></div>
<p class="help">Arrow keys or A/D to steer. Space or W to jump. Keep steering in the air to rotate; line up with the wave to land. Three lives. Runs pause when you leave the tab.</p></main><script type="module" src="src/main.js"></script></body></html>
